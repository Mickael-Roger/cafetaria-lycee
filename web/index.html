<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2e7d32" />
  <meta name="description" content="School cafeteria reservation manager" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Cafeteria</title>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>

  <!-- ======================= LOGIN VIEW ======================= -->
  <section id="view-login" class="view hidden">
    <div class="login-card">
      <img src="/icons/icon-192.png" alt="" class="login-logo" />
      <h1>Cafeteria</h1>
      <p class="login-subtitle">School cafeteria reservations</p>
      <form id="login-form" autocomplete="on">
        <label for="login-username">Username</label>
        <input id="login-username" name="username" type="text"
               autocomplete="username" autocapitalize="none" required />
        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password"
               autocomplete="current-password" required />
        <button type="submit" id="login-submit" class="btn btn-primary btn-block">Sign in</button>
        <p id="login-error" class="error-text hidden"></p>
      </form>
    </div>
  </section>

  <!-- ======================== MAIN VIEW ======================== -->
  <section id="view-main" class="view hidden">
    <header class="app-header">
      <div class="header-title">
        <h1>Cafeteria</h1>
        <span id="status-line" class="status-line">Loading…</span>
      </div>
      <div class="header-actions">
        <button id="btn-refresh" class="icon-btn" title="Refresh" aria-label="Refresh">⟳</button>
        <button id="btn-logout" class="icon-btn" title="Log out" aria-label="Log out">⎋</button>
      </div>
    </header>

    <div id="offline-banner" class="offline-banner hidden">You are offline – showing saved data</div>

    <div id="warning-banner" class="warning-banner hidden"></div>

    <main class="content">
      <!-- Credit card -->
      <div class="credit-card">
        <span class="credit-label">Cafeteria credit</span>
        <span id="credit-value" class="credit-value">…</span>
      </div>

      <!-- Next reservation highlight -->
      <div id="next-reservation" class="next-card hidden">
        <span class="next-label">Next reserved meal</span>
        <span id="next-reservation-date" class="next-date"></span>
      </div>

      <!-- Reservation list -->
      <h2 class="section-title">Upcoming days</h2>
      <ul id="reservation-list" class="reservation-list"></ul>
      <p id="list-empty" class="empty-text hidden">No reservation days available.</p>
    </main>

    <div id="toast" class="toast hidden"></div>
  </section>

  <!-- Install prompt -->
  <div id="install-banner" class="install-banner hidden">
    <span>Install the app on your phone</span>
    <button id="btn-install" class="btn btn-primary">Install</button>
    <button id="btn-install-dismiss" class="icon-btn" aria-label="Dismiss">✕</button>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () =>
        navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
